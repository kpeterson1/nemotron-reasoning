[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-reasoning"
version = "0.1.0"
description = "Competition entry for NVIDIA Nemotron Model Reasoning Challenge."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "peft",
    "vllm",
    "jsonlines",
    "pyyaml",
    "pandas",
    "numpy",
    "tqdm",
    "datasets",
    "accelerate",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
