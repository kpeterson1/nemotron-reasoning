# IMPORTANT: These match the ACTUAL Kaggle evaluation harness parameters
# (verified via competitive intelligence — earlier values were function defaults
# that get overridden by the live evaluator).
# Source: https://www.kaggle.com/code/metric/nvidia-nemotron-metric
model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
temperature: 0.0
top_p: 1.0
max_tokens: 7680
max_model_len: 8192
max_lora_rank: 32
gpu_memory_utilization: 0.85
enable_thinking: true
# The harness appends this suffix to every prompt:
prompt_suffix: "\nPlease put your final answer inside `\\boxed{}`. For example: `\\boxed{your answer}`"
