# SMOKE TEST: verify PEFT can LoRA-train NemotronH routed experts (3D nn.Parameter)
# via target_parameters. Same target_modules regex as v9, plus the two routed-expert
# parameter names. Small r so the adapter fits comfortably and the smoke save is cheap.
model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
lora:
  r: 8
  lora_alpha: 16
  target_modules: ".*\\.(in_proj|out_proj|up_proj|down_proj|gate_proj|q_proj|k_proj|v_proj|o_proj)$"
  # Targets the 3D nn.Parameter tensors inside NemotronHExperts.
  # Path: backbone.layers.<L>.mixer.experts.{up_proj,down_proj}
  # PEFT matches by suffix, so the trailing two segments are sufficient.
  target_parameters:
    - "mixer.experts.up_proj"
    - "mixer.experts.down_proj"
  lora_dropout: 0.0
  bias: "none"
  task_type: "CAUSAL_LM"
training:
  learning_rate: 3.0e-4
  num_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.0
  bf16: true
  max_seq_length: 8192
data:
  train_file: datasets/processed/train_formatted_v9.jsonl
  eval_file: datasets/splits/dev_frozen.jsonl
output_dir: runs/train/lora_v9_targetparams_smoke
