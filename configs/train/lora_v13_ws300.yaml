# v13 stage-2: identical to lora_v9_warm_start_300step.yaml except train_file,
# warm_start_adapter, output_dir. Freeze the stage-1 reasoning LoRA, train the
# MoE experts for 300 steps. Single-variable vs v9 ws300: only train_file (v11).
model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
lora:
  r: 32
  lora_alpha: 32
  target_modules: ".*\\.(in_proj|out_proj|up_proj|down_proj|gate_proj|q_proj|k_proj|v_proj|o_proj)$"
  target_parameters:
    - "mixer.experts.up_proj"
    - "mixer.experts.down_proj"
  rank_pattern:
    "mixer.experts.up_proj": 8
    "mixer.experts.down_proj": 8
  alpha_pattern:
    "mixer.experts.up_proj": 8
    "mixer.experts.down_proj": 8
  lora_dropout: 0.0
  bias: "none"
  task_type: "CAUSAL_LM"
  warm_start_adapter: runs/train/lora_v13
  freeze_warm_start: true
training:
  learning_rate: 3.0e-4
  num_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.05
  bf16: true
  max_seq_length: 8192
  gradient_checkpointing: true
data:
  train_file: datasets/processed/train_formatted_v13.jsonl
  eval_file: datasets/splits/dev_frozen.jsonl
output_dir: runs/train/lora_v13_ws300
