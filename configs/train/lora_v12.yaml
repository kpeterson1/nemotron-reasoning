# v12 stage-1: identical to lora_v9.yaml except train_file + output_dir.
# Single-variable experiment (Q8): bit_manip (shortened v5) + text_enc (char-by-char v5) differ from v9
# (regenerated by bit_manip_trace_v5, derivation-first). All hyperparams match
# v9 exactly (LR 3e-4, r32, 1 epoch, per_device 1 x grad_accum 8 = eff batch 8).
model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
lora:
  r: 32
  lora_alpha: 32
  target_modules: ".*\\.(in_proj|out_proj|up_proj|down_proj|gate_proj|q_proj|k_proj|v_proj|o_proj)$"
  lora_dropout: 0.0
  bias: "none"
  task_type: "CAUSAL_LM"
training:
  learning_rate: 3.0e-4
  num_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.1
  bf16: true
  max_seq_length: 8192
data:
  train_file: datasets/processed/train_formatted_v12.jsonl
  eval_file: datasets/splits/dev_frozen.jsonl
output_dir: runs/train/lora_v12
